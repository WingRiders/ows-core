[package]
name = "ows-lib"
version = "1.3.2"
edition = "2021"
license = "MIT"
description = "High-level library API for the Open Wallet Standard"
repository = "https://github.com/open-wallet-standard/core"
readme = "README.md"

[features]
default = []
fast-kdf = ["ows-signer/fast-kdf"]

[dependencies]
ows-core = { path = "../ows-core", version = "=1.3.2" }
ows-signer = { path = "../ows-signer", version = "=1.3.2" }
ows-pay = { path = "../ows-pay", version = "=1.3.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
base64 = "0.22"
getrandom = "0.2"
zeroize = "1"
sha2 = "0.10"
rand = "0.8"
k256 = { version = "0.13", features = ["schnorr"] }
serde_json_canonicalizer = "0.3"
bech32 = "0.11"
prost = "0.13"
tonic = { version = "0.12", features = ["transport"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
anyhow = "1"
midnight-ledger = "8.1.0"
midnight-ledger-static = "9.0.0"
midnight-zswap = "8.1.0"
midnight-serialize = "1.1.0"
midnight-base-crypto = "1.0.0"
midnight-storage = "2.0.1"
midnight-coin-structure = "2.0.1"
transient-crypto = { version = "2.1.0", package = "midnight-transient-crypto" }
onchain-runtime = { version = "3.1.0", package = "midnight-onchain-runtime" }
zkir_v2 = { version = "2.1.0", package = "midnight-zkir" }
subxt = { version = "0.38", default-features = false, features = ["jsonrpsee", "native"] }
jsonrpsee = { version = "0.24", features = ["ws-client", "macros"] }

[dev-dependencies]
tempfile = "3"
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = "2"
bs58 = "0.5"
ows-signer = { path = "../ows-signer", version = "=1.3.2", features = ["fast-kdf"] }
